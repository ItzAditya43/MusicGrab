<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MusicGrab</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0a0014;
    color: #f3e9ff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 340px;
    background: #150a24;
    border: 1px solid #3a1c5c;
    border-radius: 16px;
    padding: 26px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 6px;
    background: linear-gradient(135deg, #ff2e9a, #00e5ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { font-size: 13.5px; line-height: 1.6; color: #b3a0cc; margin: 0 0 18px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #b3a0cc; margin-bottom: 6px; }
  input {
    width: 100%;
    background: #0a0014;
    border: 1px solid #3a1c5c;
    color: #f3e9ff;
    border-radius: 8px;
    padding: 12px;
    font-size: 15px;
    margin-bottom: 16px;
  }
  input:focus { outline: none; border-color: #00e5ff; }
  button {
    width: 100%;
    background: linear-gradient(135deg, #ff2e9a, #00e5ff);
    color: #0a0014;
    border: none;
    border-radius: 22px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
  }
  .error { color: #ff6478; font-size: 12.5px; margin-top: 10px; min-height: 16px; }
</style>
</head>
<body>
  <div class="card">
    <h1>MusicGrab</h1>
    <p>
      Enter the address of the PC running MusicGrab (Settings &rarr; Info in the desktop app, or
      check your router). Both devices need to be on the same network.
    </p>
    <label for="addr">Server address</label>
    <input id="addr" placeholder="192.168.1.50:8765" autocapitalize="off" autocorrect="off" />
    <button id="go">Connect</button>
    <div class="error" id="error"></div>
  </div>
  <p style="text-align:center; margin-top:14px;">
    <a href="#" id="forget" style="color:#00e5ff; font-size:12px; text-decoration:none;">Use a different address</a>
  </p>
  <script>
    var input = document.getElementById("addr");
    var errorEl = document.getElementById("error");

    function normalize(value) {
      return value.trim().replace(/^https?:\/\//i, "").replace(/\/+$/, "");
    }

    function connect(addr) {
      if (!addr) {
        errorEl.textContent = "Enter an address first.";
        return;
      }
      localStorage.setItem("musicgrab.serverAddr", addr);
      location.href = "http://" + addr + "/";
    }

    // Pre-fill the last address but always require a tap to connect —
    // auto-redirecting on load would make it impossible to reach this page
    // again (e.g. to fix a stale address) short of clearing app storage.
    var saved = localStorage.getItem("musicgrab.serverAddr");
    if (saved) input.value = saved;

    document.getElementById("go").addEventListener("click", function () {
      connect(normalize(input.value));
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") connect(normalize(input.value));
    });
    document.getElementById("forget").addEventListener("click", function (e) {
      e.preventDefault();
      localStorage.removeItem("musicgrab.serverAddr");
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
