[package]
name = "tauri-plugin-musicgrab-ytdl"
version = "0.1.0"
description = "On-device yt-dlp/ffmpeg downloading for MusicGrab's Android build, via youtubedl-android"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77.2"
links = "tauri-plugin-musicgrab-ytdl"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
