name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            sidecar-suffix: ""
          - platform: windows-latest
            rust-target: x86_64-pc-windows-msvc
            sidecar-suffix: ".exe"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python project + PyInstaller
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Freeze backend into a standalone sidecar binary
        run: >
          pyinstaller
          --name musicgrab-web
          --onefile
          --paths .
          --add-data "musicgrab/web${{ matrix.platform == 'windows-latest' && ';' || ':' }}musicgrab/web"
          --collect-all yt_dlp
          --collect-submodules musicgrab
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan
          --hidden-import uvicorn.lifespan.on
          scripts/run_web.py

      - name: Place sidecar with Tauri's target-triple naming convention
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "dist/musicgrab-web${{ matrix.sidecar-suffix }}" \
             "src-tauri/binaries/musicgrab-web-${{ matrix.rust-target }}${{ matrix.sidecar-suffix }}"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (installers)
        run: cargo tauri build --target ${{ matrix.rust-target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musicgrab-${{ matrix.rust-target }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android init --ci

      # MusicGrab's Android build is a thin client: the connect.html page
      # (musicgrab/web-android/) navigates to the user's own PC over plain
      # HTTP on their LAN, which Android blocks by default (cleartext
      # traffic disabled since API 28). Allow it — there's no way to
      # allowlist a fixed domain since every user's PC has a different LAN
      # IP, and this is inherently a local-network, user-supplied address.
      - name: Allow cleartext (HTTP) traffic for LAN connections
        # An XML-aware edit, not sed: a blind text substitution on
        # "<application" risks corrupting the file if that substring shows
        # up anywhere else (a comment, a differently-named tag) — exactly
        # what broke the first attempt at this (manifest merger failed to
        # parse the file afterward).
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET

          path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          TOOLS_NS = "http://schemas.android.com/tools"
          ET.register_namespace("android", ANDROID_NS)
          ET.register_namespace("tools", TOOLS_NS)

          tree = ET.parse(path)
          app = tree.getroot().find("application")
          if app is None:
              raise SystemExit("no <application> element found in AndroidManifest.xml")
          app.set(f"{{{ANDROID_NS}}}usesCleartextTraffic", "true")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Patched", path)
          PYEOF
          grep -q 'usesCleartextTraffic' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build debug-signed APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android build --debug --target aarch64

      - name: Locate APK
        id: apk
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "Found: $apk"
          cp "$apk" musicgrab-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicgrab-android-apk
          path: musicgrab-android.apk

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: musicgrab-android.apk
