name: Release desktop builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            sidecar-suffix: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python project + PyInstaller
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Freeze backend into a standalone sidecar binary
        run: >
          pyinstaller
          --name musicgrab-web
          --onefile
          --paths .
          --add-data "musicgrab/web:musicgrab/web"
          --collect-all yt_dlp
          --collect-submodules musicgrab
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols
          --hidden-import uvicorn.protocols.http
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan
          --hidden-import uvicorn.lifespan.on
          scripts/run_web.py

      - name: Place sidecar with Tauri's target-triple naming convention
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cp "dist/musicgrab-web${{ matrix.sidecar-suffix }}" \
             "src-tauri/binaries/musicgrab-web-${{ matrix.rust-target }}${{ matrix.sidecar-suffix }}"

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri app (installers)
        run: cargo tauri build --target ${{ matrix.rust-target }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musicgrab-${{ matrix.rust-target }}
          path: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.rust-target }}/release/bundle/**/*.AppImage

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Debug-signed APKs are keyed by whatever ~/.android/debug.keystore
      # happens to exist at build time. Every CI run starts on a fresh
      # runner with no such file, so Gradle silently generates a brand new
      # one each release — meaning each APK is signed with a different key
      # and Android refuses to install it over the previous version (fails
      # silently, leaving the old app in place with no clear error). Cache
      # the keystore under a fixed key (not content-hashed) so every build
      # reuses the same one and updates actually install cleanly.
      - name: Restore/persist a stable debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set up Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android init --ci

      - name: Build debug-signed APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android build --debug --target aarch64

      - name: Locate APK
        id: apk
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "Found: $apk"
          cp "$apk" musicgrab-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musicgrab-android-apk
          path: musicgrab-android.apk

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: musicgrab-android.apk

  # No physical Android device is available anywhere in this workflow, so
  # every previous "the Android build works" claim only meant "it compiled
  # and packaged" — never that it actually runs. This job closes that gap:
  # it boots a real (KVM-accelerated, x86_64) emulator on the runner,
  # installs the just-built APK, launches it, and screenshots it at a few
  # points so the UI can actually be inspected instead of assumed.
  test-android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.0.12077973"

      - name: Set up Rust with x86_64 Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: android-emulator-test

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize Android project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android init --ci

      # x86_64, not aarch64 — the real release APK targets phones, but the
      # emulator needs an x86_64 build to run at a usable speed on these
      # (x86_64) runners via KVM.
      - name: Build debug APK for the emulator (x86_64)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: cargo tauri android build --debug --target x86_64

      - name: Locate emulator-target APK
        run: |
          apk=$(find src-tauri/gen/android -name "*.apk" | head -1)
          echo "Found: $apk"
          cp "$apk" musicgrab-android-x86_64-debug.apk

      - name: Enable KVM for hardware-accelerated emulation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and screenshot the UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p screenshots
            adb logcat -c

            adb install musicgrab-android-x86_64-debug.apk
            echo "installed packages matching musicgrab:"
            adb shell pm list packages | grep -i musicgrab || echo "(none found)"

            adb shell am start -n app.musicgrab.mobile/.MainActivity
            sleep 15
            adb exec-out screencap -p > screenshots/01-home.png
            # Capture logcat now, before anything below has a chance to
            # abort the script and lose it — this is the actual diagnostic
            # for whether the app launched/rendered correctly.
            adb logcat -d > screenshots/01-logcat.txt

            # Tap the bottom tab bar's "Your Library" position (3rd of 5
            # tabs) and "Search" (2nd of 5), screenshotting each — proves
            # navigation actually responds to touch, not just that it
            # renders. `wm size` can print both a "Physical size" and an
            # "Override size" line — take only the first match, and strip
            # any \r since adb shell output is CRLF-terminated.
            #
            # This whole block is one shell line (semicolon-joined, not
            # newline-joined): this action runs the script's lines as
            # separate `sh -c` invocations rather than one continuous
            # session, so variables set on one line don't exist on the
            # next — confirmed by the previous run logging w='' h=''
            # despite the assignment line itself succeeding in isolation.
            #
            # bar_y = h - 124, not h - 60: the mobile layout reserves 64px
            # for the nav bar *and* 92px for the player bar below it
            # (app.css's max-width:720px rules), so the nav bar's vertical
            # center sits well above the very bottom edge — h - 60 landed
            # in the player bar instead, which explained three identical
            # "still on Home" screenshots despite the taps executing fine.
            size=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | head -1 | tr -d '\r'); w=$(echo "$size" | cut -dx -f1); h=$(echo "$size" | cut -dx -f2); echo "screen size: raw='$size' w='$w' h='$h'"; bar_y=$((h - 124)); tap_x_search=$((w * 3 / 10)); tap_x_library=$((w * 5 / 10)); echo "tapping search at $tap_x_search,$bar_y"; adb shell input tap $tap_x_search $bar_y; sleep 2; adb exec-out screencap -p > screenshots/02-search-tab.png; echo "tapping library at $tap_x_library,$bar_y"; adb shell input tap $tap_x_library $bar_y; sleep 2; adb exec-out screencap -p > screenshots/03-library-tab.png

            adb logcat -d > screenshots/02-logcat-final.txt

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-screenshots
          path: screenshots/
